<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survival Horror 2D - Sandbox</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #0b0c10;
        color: #c5c6c7;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
      }
      #game-container {
        position: relative;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(255, 255, 255, 0.05);
        border-radius: 4px;
        overflow: hidden;
      }
      canvas {
        display: block;
        outline: none;
      }
      #hud-instructions {
        position: absolute;
        bottom: 12px;
        left: 16px;
        background: rgba(15, 17, 23, 0.75);
        backdrop-filter: blur(6px);
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
        line-height: 1.5;
        color: #d1d5db;
        pointer-events: none;
        z-index: 10;
      }
      #hud-instructions kbd {
        background: #1f2937;
        border: 1px solid #374151;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
        color: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="hud-instructions">
        <div><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> Mover &bull; <kbd>Shift</kbd> Correr &bull; <kbd>Mouse</kbd> Olhar / Mirar</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
